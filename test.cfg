http-request set-var(txn.rate_limit_get) var(txn.seal_id),map_reg(/app/haproxy/file.map, "^([^[:space:]]+)[[:space:]]+([^[:space:]]+).*", "\\2") if seal_id_exists
    http-request set-var(txn.rate_limit_post) 

http-request set-var(txn.rate_limit_get) var(txn.seal_id),map_reg(/app/haproxy/file.map, ^%[var(txn.seal_id)]\ +([0-9]+)\ +.*$, \1) if seal_id_exists

# Load values from map file when seal_id exists
    # Using a simpler approach with field extraction
    http-request set-var(txn.map_line) var(txn.seal_id),map(/app/haproxy/file.map,-)
    
    # Extract fields using field converter with indexes
    http-request set-var(txn.rate_limit_get) var(txn.map_line),field(2,' ') if seal_id_exists
    http-request set-var(txn.rate_limit_post) var(txn.map_line),field(3,' ') if seal_id_exists
    http-request set-var(txn.rate_limit_patch) var(txn.map_line),field(4,' ') if seal_id_exists
    http-request set-var(txn.rate_limit_delete) var(txn.map_line),field(5,' ') if seal_id_exists
