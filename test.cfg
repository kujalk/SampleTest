I see the issue now. In HAProxy, when comparing variables in ACLs, you need to use a different syntax. Let me fix that part of the configuration:
frontend adscimapi
    bind *:80
    log global
    option httplog
    mode http
    monitor-uri /checkstatus

    # Define stick table for rate limiting
    stick-table type string len 64 size 1m expire 1m store http_req_rate(10s),http_req_rate(60s)

    # JWT extraction - using http_auth_bearer instead of jwt_payload_query
    acl has_auth_header req.hdr(Authorization) -m found
    http-request set-var(txn.auth_token) req.hdr(Authorization),field(2,' ') if has_auth_header

    http-request set-var(txn.client_id) http_auth_bearer,jwt_payload_query('$.client_id')
    http-request set-var(txn.seal_id) var(txn.client_id),field(2,-)

    # Create tracking key combining seal_id and method
    http-request set-header X-Concat %[var(txn.seal_id)]-%[method]

    # Track the request using the combined key
    http-request track-sc0 hdr(X-Concat)

    # Load rate limits from map file - parse each limit type separately
    acl seal_id_exists var(txn.seal_id) -m found
    
    # Default values if seal_id not found
    http-request set-var(txn.rate_limit_get) str(10) if !seal_id_exists
    http-request set-var(txn.rate_limit_post) str(10) if !seal_id_exists
    http-request set-var(txn.rate_limit_patch) str(10) if !seal_id_exists
    http-request set-var(txn.rate_limit_delete) str(5) if !seal_id_exists

    # Using a simpler approach with field extraction
    http-request set-var(txn.map_line) var(txn.seal_id),map(/app/haproxy/file.map,-)
    
    # Extract fields using field converter with indexes
    http-request set-var(txn.rate_limit_get) var(txn.map_line),field(2,' ') if seal_id_exists
    http-request set-var(txn.rate_limit_post) var(txn.map_line),field(3,' ') if seal_id_exists
    http-request set-var(txn.rate_limit_patch) var(txn.map_line),field(4,' ') if seal_id_exists
    http-request set-var(txn.rate_limit_delete) var(txn.map_line),field(5,' ') if seal_id_exists

    # Rate limiting based on method
    # Define ACLs for each method
    acl is_get_method method GET
    acl is_post_method method POST
    acl is_patch_method method PATCH
    acl is_delete_method method DELETE

    # Check rate against appropriate limit based on method
    # Fixed syntax for comparing variables
    acl rate_limit_exceeded_get sc0_http_req_rate(60s) gt var(txn.rate_limit_get) if is_get_method
    acl rate_limit_exceeded_post sc0_http_req_rate(60s) gt var(txn.rate_limit_post) if is_post_method
    acl rate_limit_exceeded_patch sc0_http_req_rate(60s) gt var(txn.rate_limit_patch) if is_patch_method
    acl rate_limit_exceeded_delete sc0_http_req_rate(60s) gt var(txn.rate_limit_delete) if is_delete_method

    # Combine all rate limit conditions into one ACL
    acl rate_limit_exceeded rate_limit_exceeded_get or rate_limit_exceeded_post or rate_limit_exceeded_patch or rate_limit_exceeded_delete

    # Deny requests that exceed their rate limit
    http-request deny if rate_limit_exceeded
