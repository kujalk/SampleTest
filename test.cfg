# Enhanced Rate Limiter for all HTTP methods
acl get_method method GET
acl post_method method POST
acl delete_method method DELETE
acl patch_method method PATCH

# Track requests by client ID and method
stick-table type string size 100k store http_req_rate(10s),http_req_cnt

# Check if requests exceed limits
acl get_exceeds_limit var(txn.clientid),table_http_req_rate(get_rate_limit),sub(txn.allowed_get_calls) gt 0
acl post_exceeds_limit var(txn.clientid),table_http_req_rate(post_rate_limit),sub(txn.allowed_post_calls) gt 0
acl delete_exceeds_limit var(txn.clientid),table_http_req_rate(delete_rate_limit),sub(txn.allowed_delete_calls) gt 0
acl patch_exceeds_limit var(txn.clientid),table_http_req_rate(patch_rate_limit),sub(txn.allowed_patch_calls) gt 0

# Check if requests exceed burst limits (allow short bursts but log warnings)
acl get_exceeds_burst var(txn.clientid),table_http_req_rate(get_rate_limit),sub(txn.burst_get_calls) gt 0
acl post_exceeds_burst var(txn.clientid),table_http_req_rate(post_rate_limit),sub(txn.burst_post_calls) gt 0
acl delete_exceeds_burst var(txn.clientid),table_http_req_rate(delete_rate_limit),sub(txn.burst_delete_calls) gt 0
acl patch_exceeds_burst var(txn.clientid),table_http_req_rate(patch_rate_limit),sub(txn.burst_patch_calls) gt 0

# Track requests
http-request track-sc0 var(txn.clientid) table get_rate_limit if get_method
http-request track-sc1 var(txn.clientid) table post_rate_limit if post_method
http-request track-sc2 var(txn.clientid) table delete_rate_limit if delete_method
http-request track-sc3 var(txn.clientid) table patch_rate_limit if patch_method

# Add warning headers for clients approaching limits
http-response add-header X-Rate-Limit-Warning "Approaching limit" if { sc_http_req_rate(0) gt 75% of txn.allowed_get_calls } get_method
http-response add-header X-Rate-Limit-Warning "Approaching limit" if { sc_http_req_rate(1) gt 75% of txn.allowed_post_calls } post_method
http-response add-header X-Rate-Limit-Warning "Approaching limit" if { sc_http_req_rate(2) gt 75% of txn.allowed_delete_calls } delete_method
http-response add-header X-Rate-Limit-Warning "Approaching limit" if { sc_http_req_rate(3) gt 75% of txn.allowed_patch_calls } patch_method

# Return 429 Too Many Requests when limits exceeded
http-request deny status 429 unless !get_exceeds_limit get_method
http-request deny status 429 unless !post_exceeds_limit post_method
http-request deny status 429 unless !delete_exceeds_limit delete_method
http-request deny status 429 unless !patch_exceeds_limit patch_method

# Add required response headers
http-response add-header X-Rate-Limit-Remaining "%[sc0_http_req_cnt,sub(txn.allowed_get_calls)]" if get_method
http-response add-header X-Rate-Limit-Remaining "%[sc1_http_req_cnt,sub(txn.allowed_post_calls)]" if post_method
http-response add-header X-Rate-Limit-Remaining "%[sc2_http_req_cnt,sub(txn.allowed_delete_calls)]" if delete_method
http-response add-header X-Rate-Limit-Remaining "%[sc3_http_req_cnt,sub(txn.allowed_patch_calls)]" if patch_method
